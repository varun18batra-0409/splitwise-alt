# Daily backup of the online database. The file is ENCRYPTED before it is
# stored, because this repository is public. Kept for 14 days.
# INTERIM: this moves to a private repo (see ops/private-repo/README.md) and is then deleted.
# Needs TURSO_DATABASE_URL and TURSO_READONLY_TOKEN (a READ-ONLY key: this job only reads, so the full key is never given to
# it), both from the environment live-read, and the repository secret BACKUP_PASSPHRASE. If any is missing the run FAILS (red).
#
# Every run also does a restore drill: the backup is rebuilt into a scratch
# database, every table is checked, and so is the data (references, shares,
# balances). A drill that finds a problem fails the run.
#
# To restore for real: download the "db-backup" file from the run, then
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup.json.enc -out backup.json
# (type the passphrase), create a NEW empty Turso database, and run
#   TURSO_AUTH_TOKEN=<its token> node scripts/restore.mjs backup.json libsql://<new-db-url>
# then point the app's TURSO_DATABASE_URL / TURSO_AUTH_TOKEN at it and redeploy.
name: Backup
on:
  schedule:
    - cron: "17 21 * * *" # every day, 02:47 India time
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-24.04
    # The READ-ONLY database key (TURSO_READONLY_TOKEN) and the address (TURSO_DATABASE_URL) live in this environment, not in the
    # repository secrets. Jobs in an environment still read the repository secrets too (BACKUP_PASSPHRASE).
    environment: live-read
    # The secrets are given only to the two steps that use them (not to the whole job).
    steps:
      - name: Check the secrets are set
        id: ready
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # A missing database key is a real failure (a night without a backup must be red, not a quiet skip).
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error title=Backup FAILED::TURSO_DATABASE_URL or TURSO_READONLY_TOKEN is missing from the live-read environment (Settings > Environments > live-read)."
            exit 1
          fi
          # No passphrase means no way to encrypt, so no backup: also a failure, never a quiet skip.
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error title=Backup FAILED::BACKUP_PASSPHRASE is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.ready.outputs.ok == '1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.ready.outputs.ok == '1'
        with:
          node-version: 22
          cache: npm # the downloaded packages are kept between runs (keyed by package-lock.json)
          cache-dependency-path: package-lock.json
      - name: Dump and encrypt
        if: steps.ready.outputs.ok == '1'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --prefer-offline --no-audit --no-fund @libsql/client@0.15.0
          node scripts/backup.mjs "$RUNNER_TEMP/backup.json"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE \
            -in "$RUNNER_TEMP/backup.json" -out "$RUNNER_TEMP/backup.json.enc"
          rm -f "$RUNNER_TEMP/backup.json"
          # Prove the encrypted copy opens with the passphrase.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_PASSPHRASE \
            -in "$RUNNER_TEMP/backup.json.enc" -out "$RUNNER_TEMP/check.json"
          grep -q '"takenAt"' "$RUNNER_TEMP/check.json"
          # Restore drill: rebuild the whole database from the backup in a scratch
          # file, check every table's row count matches, then check the data is whole:
          # database integrity, PRAGMA foreign_key_check, every expense's shares add up,
          # every group's balances net to 0, nothing points to a missing member.
          # Any problem fails this step (and so the backup run).
          drill=0
          node scripts/restore.mjs "$RUNNER_TEMP/check.json" "file:$RUNNER_TEMP/drill.db" > "$RUNNER_TEMP/drill.log" 2>&1 || drill=$?
          cat "$RUNNER_TEMP/drill.log"
          if [ "$drill" -ne 0 ] || grep -q '^✗' "$RUNNER_TEMP/drill.log"; then
            echo "::error title=Restore drill FAILED::exit $drill. $(grep '^✗' "$RUNNER_TEMP/drill.log" | head -8 | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"
            rm -f "$RUNNER_TEMP/check.json" "$RUNNER_TEMP/drill.db"
            exit 1
          fi
          echo "::notice title=Restore drill::$(tail -1 "$RUNNER_TEMP/drill.log") $(grep -c '✓' "$RUNNER_TEMP/drill.log") checks OK."
          rm -f "$RUNNER_TEMP/check.json" "$RUNNER_TEMP/drill.db"
          echo "::notice title=Backup::Encrypted backup saved ($(du -h "$RUNNER_TEMP/backup.json.enc" | cut -f1))."
      # Kept even when the drill failed (the run is red, but the file is still the best copy there is).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.ready.outputs.ok == '1'
        with:
          name: db-backup
          path: ${{ runner.temp }}/backup.json.enc
          retention-days: 14
          if-no-files-found: warn
