# One-off: fetch the app's two fonts from npm (Fontsource), so the app can ship them itself.
name: Live SEO check
on:
  push:
    branches: [check-live-seo]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set -e
          mkdir -p /tmp/f && cd /tmp/f
          npm pack @fontsource-variable/fraunces@5 @fontsource/caveat@5 >/dev/null
          for t in *.tgz; do mkdir -p "x-$t" && tar -xzf "$t" -C "x-$t"; done
          mkdir -p out
          ls x-*/package/files | head -50
          cp x-*fraunces*/package/files/fraunces-latin-wght-normal.woff2 out/ || true
          cp x-*fraunces*/package/files/fraunces-latin-ext-wght-normal.woff2 out/ || true
          cp x-*caveat*/package/files/caveat-latin-600-normal.woff2 out/ || true
          cp x-*caveat*/package/files/caveat-latin-700-normal.woff2 out/ || true
          cp x-*fraunces*/package/LICENSE out/LICENSE-fraunces || true
          cp x-*caveat*/package/LICENSE out/LICENSE-caveat || true
          ls -la out
          echo "::notice title=Fonts::$(ls out | tr '\n' ' ')"
          cd out && git init -q -b fonts && git add . && git -c user.name=bot -c user.email=bot@x commit -qm fonts
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fonts:fetched-fonts
