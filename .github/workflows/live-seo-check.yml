# One-off: confirm the live site after a release.
name: Live SEO check
on:
  push:
    branches: [check-live-seo]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          s=https://www.loopinapps.com
          for p in collect/new c/zzzzzzzzzzz notifications api/unread photos/place-goa.jpg photos/place-thailand.jpg photos/place-switzerland.jpg; do
            c=$(curl -s -o /tmp/o -w "%{http_code} %{content_type} %{size_download}" "$s/$p"); echo "::notice title=$p::$c $(grep -o 'Collections on this phone\|More options\|{"n":[0-9]*}' /tmp/o | head -1)"
          done
