# One-off: confirm the live site after a release.
name: Live SEO check
on:
  push:
    branches: [check-live-seo]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          s=https://www.loopinapps.com
          ls=$(curl -s "$s/photos/" -o /dev/null -w "%{http_code}")
          for p in place-manali.jpg place-himachal.jpg; do echo "::notice title=/photos/$p::$(curl -s -o /dev/null -w "%{http_code} %{size_download}" "$s/photos/$p")"; done
          curl -s -A "WhatsApp/2.24.20.80 A" "$s/how-it-works" -o /tmp/h
          head=$(sed 's#</head>.*##' /tmp/h | tr -d '\n')
          echo "::notice title=WhatsApp preview::description $(echo "$head" | grep -o '<meta name="description"' | wc -l), og:image $(echo "$head" | grep -o 'property="og:image"' | wc -l)"
          css=$(curl -s "$s/" | grep -o '/_next/static/css/[^"]*\.css' | sort -u | head -5)
          for f in $css; do curl -s "$s$f" >> /tmp/all.css; done
          echo "::notice title=New styles::lp-takeoff $(grep -o 'lp-takeoff' /tmp/all.css | wc -l) · lp-fly $(grep -o 'lp-fly' /tmp/all.css | wc -l) · lp-streak $(grep -o 'lp-streak' /tmp/all.css | wc -l)"
