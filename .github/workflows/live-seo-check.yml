name: Live SEO check
on:
  push:
    branches: [check-live-seo]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          s=https://www.loopinapps.com
          for p in "" signin faq how-it-works account settle api/health; do echo "::notice title=/$p::$(curl -s -o /dev/null -w '%{http_code}' "$s/$p")"; done
          echo "::notice title=faq-pay::$(curl -s "$s/faq" | grep -c 'Can people pay me with UPI')"
          echo "::notice title=faq-quick::$(curl -s "$s/faq" | grep -c 'Can I just type an expense')"
