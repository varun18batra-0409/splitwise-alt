# One-off: confirm the live site after a release (Collect + countdown).
name: Live SEO check
on:
  push:
    branches: [check-live-seo]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          s=https://www.loopinapps.com
          c=$(curl -s -o /tmp/a -w "%{http_code}" "$s/collect/new"); echo "::notice title=collect/new::$c $(grep -o 'Chasing[^<]*' /tmp/a | head -1)"
          c=$(curl -s -o /tmp/b -w "%{http_code}" "$s/c/zzzzzzzzzzz"); echo "::notice title=c/unknown (404 = table ready, 500 = not)::$c"
          c=$(curl -s -o /tmp/r -w "%{http_code}" "$s/robots.txt"); echo "::notice title=robots::$c $(grep -o '/c/\|/collect' /tmp/r | tr '\n' ' ')"
          c=$(curl -s -o /tmp/h -w "%{http_code}" "$s/"); echo "::notice title=home::$c"
          c=$(curl -s -o /tmp/g -w "%{http_code}" "$s/groups/zzzz/countdown-image"); echo "::notice title=countdown image without access (expect 404)::$c"
