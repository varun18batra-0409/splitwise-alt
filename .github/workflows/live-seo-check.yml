name: Live SEO check
on:
  push:
    branches: [check-live-seo]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          s=https://www.loopinapps.com
          echo "::notice title=HEAD home::$(curl -sI "$s/" | tr -d '\r' | cut -c1-120 | tr '\n' '|')"
          echo "::notice title=GET home::$(curl -s -D - -o /dev/null "$s/" | tr -d '\r' | cut -c1-120 | tr '\n' '|')"
          echo "::notice title=GET signin::$(curl -s -D - -o /dev/null "$s/signin" | tr -d '\r' | grep -iE 'content-security|x-frame|strict' | cut -c1-60 | tr '\n' '|')"
