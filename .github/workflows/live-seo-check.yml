# One-off: confirm the live site after a release.
name: Live SEO check
on:
  push:
    branches: [check-live-seo]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          s=https://www.loopinapps.com
          curl -s "$s/how-it-works" -o /tmp/h
          echo "::notice title=New names on How it works::Bites $(grep -c 'Bites &amp; Sips' /tmp/h) · Wheels $(grep -c 'Wheels &amp; Wings' /tmp/h) · Beds $(grep -c 'Beds &amp; Bunks' /tmp/h)"
          css=$(curl -s "$s/" | grep -o '/_next/static/css/[^"]*\.css' | sort -u | head -5)
          for f in $css; do curl -s "$s$f" >> /tmp/all.css; done
          echo "::notice title=Moving icons styles::lp-k-train $(grep -o 'lp-k-train' /tmp/all.css | wc -l) · lp-k-steam $(grep -o 'lp-k-steam' /tmp/all.css | wc -l) · lp-takeoff $(grep -o 'lp-takeoff' /tmp/all.css | wc -l) · lp-mo-once $(grep -o 'lp-mo-once' /tmp/all.css | wc -l)"
          for p in "" groups/new collect/new notifications; do echo "::notice title=/$p::$(curl -s -o /dev/null -w '%{http_code}' "$s/$p")"; done
