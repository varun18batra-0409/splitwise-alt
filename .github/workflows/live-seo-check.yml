name: Live SEO check
on:
  push:
    branches: [check-live-seo]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          s=https://www.loopinapps.com
          for p in "" signin faq how-it-works api/health; do echo "::notice title=/$p::$(curl -s -o /dev/null -w '%{http_code}' "$s/$p")"; done
          echo "::notice title=pot-help::$(curl -s "$s/how-it-works" | grep -c 'Count the money')"
          echo "::notice title=pot-faq::$(curl -s "$s/faq" | grep -c 'Calculate &amp; settle')"
