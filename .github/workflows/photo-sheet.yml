# Builds contact sheets of candidate replacement photos for founder approval (nothing is deployed or changed in the app).
# Downloads each photo from Unsplash (the runner can; the dev workspace cannot), draws sheets with Pillow, and pushes the PNGs
# to an orphan branch "screenshots-phase-photos-world".
name: Photo sheet world
on:
  push:
    branches: [phase-photos-world]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: photo-sheet-world
  cancel-in-progress: true
jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/photo-sheet-world.py out
      - name: Push the sheets to the orphan branch
        run: |
          cd out
          git init -q -b screenshots-phase-photos-world
          git config user.name "photo-sheet"
          git config user.email "photo-sheet@users.noreply.github.com"
          git add -A
          git commit -q -m "Photo contact sheets for ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/screenshots-phase-photos-world
