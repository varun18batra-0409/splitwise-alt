# One-off helper for the phase-upgrade branch only: this workspace can't download packages, so GitHub does it.
# It runs the npm command in ops/npm-command.txt, then commits package.json and package-lock.json back to this branch.
# Delete this file before the branch is merged.
name: Lockfile refresh (phase-upgrade only)
on:
  push:
    branches: [phase-upgrade]
    paths: ["ops/npm-command.txt"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run the npm command
        run: |
          set -euo pipefail
          cmd=$(grep -v '^#' ops/npm-command.txt | sed '/^\s*$/d')
          case "$cmd" in npm\ *) ;; *) echo "::error::ops/npm-command.txt must hold one npm command"; exit 1;; esac
          echo "Running: $cmd"
          bash -c "$cmd --ignore-scripts"
          npm ls next react react-dom prisma @prisma/client @prisma/adapter-libsql --depth=0 || true
          npm audit --omit=dev --json > /tmp/audit.json || true
          echo "::notice title=npm audit after::$(node -e "const a=require('/tmp/audit.json');console.log(JSON.stringify((a.metadata||{}).vulnerabilities||{}))")"
      - name: Commit the new lockfile
        run: |
          git config user.name "lockfile-bot"
          git config user.email "ci@loopin.invalid"
          git add package.json package-lock.json
          if git diff --cached --quiet; then echo "::notice::Nothing changed"; exit 0; fi
          git commit -m "Lockfile: $(grep -v '^#' ops/npm-command.txt | sed '/^\s*$/d')"
          git push origin HEAD:phase-upgrade
