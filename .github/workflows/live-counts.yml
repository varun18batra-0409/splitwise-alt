# Read-only counts on the LIVE database for five clean-up items (history lines showing an email, names wrongly marked joined,
# people who left with a balance, rows pointing at nothing, old "I've paid" notes). It only counts: nothing is fixed.
# Runs ONLY when the branch ops-live-counts is pushed, with the READ-ONLY key (environment "live-read").
# The script refuses to count if the key can write. Prints counts and size bands only: no names, emails, amounts or ids.
name: Live counts (read-only)
on:
  push:
    branches: [ops-live-counts]
permissions:
  contents: read
concurrency:
  group: live-counts
jobs:
  counts:
    if: github.ref == 'refs/heads/ops-live-counts'
    environment: live-read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm install --no-save --ignore-scripts tsx@4.19.2
      - name: Counts (prints notices, counts only)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_TOKEN }}
          CUTOFF: "2026-11-11T21:06:07Z" # when the Batch B release (no email in invite history lines) was made
        run: npx tsx scripts/live-counts.mjs
