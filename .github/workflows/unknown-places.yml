# Which places do people name that Loopin has no photo for? Every 3 days (and by hand), so new place photos can be added.
# READ-ONLY on the database (one SELECT). Output: the run's summary page, and a small file unknown-places.json on the
# "places-report" branch (a branch with no other history).
#
# PRIVACY: this repository is PUBLIC. So ONLY aggregates are output: a place name that at least 2 different trips named,
# most-named first, at most 200 (scripts/unknown-places.mjs). Never group names or ids, people, accounts or tags.
# Uses the same secrets as Live stats: TURSO_DATABASE_URL and TURSO_AUTH_TOKEN. Without them it skips quietly.
name: Unknown places
on:
  schedule:
    - cron: "41 20 */3 * *"
  workflow_dispatch:
permissions:
  contents: write # only to update the "places-report" branch
jobs:
  report:
    runs-on: ubuntu-24.04
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Check the secrets are set
        id: ready
        run: |
          if [ -n "$TURSO_DATABASE_URL" ] && [ -n "$TURSO_AUTH_TOKEN" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Unknown places skipped::Add TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in Settings → Secrets → Actions."
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == '1'
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts @libsql/client@0.15.0
        if: steps.ready.outputs.ok == '1'
      - name: List the places
        if: steps.ready.outputs.ok == '1'
        run: node scripts/unknown-places.mjs && cat unknown-places.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save to the "places-report" branch
        if: steps.ready.outputs.ok == '1'
        run: |
          mkdir /tmp/r && cp unknown-places.json /tmp/r/ && cd /tmp/r
          git init -q -b places-report && git add unknown-places.json
          git -c user.name=ci -c user.email=ci@loopin.invalid commit -qm "Places without a photo, $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" places-report
