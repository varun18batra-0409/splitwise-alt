# Which places do people name that Loopin has no photo for? Every 3 days (and by hand), so new place photos can be added.
# READ-ONLY on the database (one SELECT).
#
# PRIVACY: this repository is PUBLIC, so NO place name is ever written here: not in the run's summary, not in a branch.
# The summary shows only a count. The list of names (places named by 3 or more different accounts, most-named first,
# at most 200, as unknown-places.json) is pushed to a separate PRIVATE repository, and only when both of these are set.
#
# THE FOUNDER MUST SET UP (once):
#   1. Create a PRIVATE repository, e.g. <owner>/loopin-reports.
#   2. Create a token that can write to that repository only (a fine-grained token with "Contents: read and write"),
#      and save it here as the repository secret REPORTS_TOKEN.
#   3. Save the repository's name as the repository variable REPORTS_REPO (Settings → Secrets and variables → Actions → Variables).
#   Until both exist, the job only says "N places waiting, report repo not set up".
# RECOMMENDED: a READ-ONLY Turso token, saved as the secret TURSO_READ_TOKEN. It is used when present; otherwise the
# usual TURSO_AUTH_TOKEN (the same secrets as Live stats).
name: Unknown places
on:
  schedule:
    - cron: "41 20 */3 * *"
  workflow_dispatch:
permissions:
  contents: read # the push to the private repository uses REPORTS_TOKEN, not this
jobs:
  report:
    runs-on: ubuntu-24.04
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      REPORTS_REPO: ${{ vars.REPORTS_REPO }}
      REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
    steps:
      - name: Check the secrets are set
        id: ready
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READ_TOKEN || secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -n "$TURSO_DATABASE_URL" ] && [ -n "$TURSO_AUTH_TOKEN" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Unknown places skipped::Add TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in Settings → Secrets → Actions."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.ready.outputs.ok == '1'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.ready.outputs.ok == '1'
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts @libsql/client@0.15.0
        if: steps.ready.outputs.ok == '1'
      - name: Count the places (names are never printed)
        if: steps.ready.outputs.ok == '1'
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READ_TOKEN || secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/unknown-places.mjs && cat unknown-places.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the list to the PRIVATE reports repository
        if: steps.ready.outputs.ok == '1' && env.REPORTS_REPO != '' && env.REPORTS_TOKEN != ''
        run: |
          [ -f unknown-places.json ] || exit 0
          mkdir /tmp/r && cp unknown-places.json /tmp/r/ && cd /tmp/r
          git init -q -b places-report && git add unknown-places.json
          git -c user.name=ci -c user.email=ci@loopin.invalid commit -qm "Places without a photo, $(date -u +%F)"
          git push -qf "https://x-access-token:${REPORTS_TOKEN}@github.com/${REPORTS_REPO}.git" places-report >/dev/null 2>&1 || { echo "::error title=Reports repository::could not save the list (check REPORTS_REPO and REPORTS_TOKEN)."; exit 1; }
