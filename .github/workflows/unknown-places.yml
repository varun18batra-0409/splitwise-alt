# Which places do people name that Loopin has no photo for? Every 3 days (and by hand), so new place photos can be added.
# READ-ONLY on the database (one SELECT).
#
# PRIVACY: this repository is PUBLIC, so NO place name is ever written here: not in the run's summary, not in a branch.
# The summary shows only a count. The list of names (places named by 3 or more different accounts, most-named first,
# at most 200, as unknown-places.json) is pushed to a separate PRIVATE repository, and only when both of these are set.
#
# THE FOUNDER MUST SET UP (once):
#   1. Create a PRIVATE repository, e.g. <owner>/loopin-reports.
#   2. Create a token that can write to that repository only (a fine-grained token with "Contents: read and write"),
#      and save it here as the repository secret REPORTS_TOKEN.
#   3. Save the repository's name as the repository variable REPORTS_REPO (Settings → Secrets and variables → Actions → Variables).
#   Until both exist, the job only says "N places waiting, report repo not set up".
#   4. A READ-ONLY Turso token for the live database, saved as the secret TURSO_READONLY_TOKEN (the same one Schema plan uses).
#      The full live key is never used here: without the read-only token the job only says it is not set up.
# Each secret is given only to the step that needs it, and the list is pushed only after GitHub confirms REPORTS_REPO is private
# and is not this repository.
name: Unknown places
on:
  schedule:
    - cron: "41 20 */3 * *"
  workflow_dispatch:
permissions:
  contents: read # the push to the private repository uses REPORTS_TOKEN, not this
jobs:
  report:
    runs-on: ubuntu-24.04
    environment: live-read # holds the read-only database key and the address
    env:
      REPORTS_REPO: ${{ vars.REPORTS_REPO }}
    steps:
      - name: Check the secrets are set
        id: ready
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_TOKEN }}
        run: |
          if [ -n "$TURSO_DATABASE_URL" ] && [ -n "$TURSO_AUTH_TOKEN" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Unknown places skipped::Add TURSO_DATABASE_URL and a read-only TURSO_READONLY_TOKEN in Settings → Secrets → Actions."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.ready.outputs.ok == '1'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.ready.outputs.ok == '1'
        with:
          node-version: 22
      - run: npm install --no-save --ignore-scripts @libsql/client@0.15.0
        if: steps.ready.outputs.ok == '1'
      - name: Count the places (names are never printed)
        if: steps.ready.outputs.ok == '1'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_TOKEN }}
          # Only whether the reports token exists ("set" or empty), never the token itself.
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN != '' && 'set' || '' }}
        run: node scripts/unknown-places.mjs && cat unknown-places.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save the list to the PRIVATE reports repository
        if: steps.ready.outputs.ok == '1' && env.REPORTS_REPO != ''
        env:
          REPORTS_TOKEN: ${{ secrets.REPORTS_TOKEN }}
          THIS_REPO: ${{ github.repository }}
        run: |
          [ -n "$REPORTS_TOKEN" ] || exit 0
          [ -f unknown-places.json ] || exit 0
          # Never this (public) repository, and only a repository GitHub says is private.
          if [ "$(echo "$REPORTS_REPO" | tr A-Z a-z)" = "$(echo "$THIS_REPO" | tr A-Z a-z)" ]; then echo "::error title=Reports repository::REPORTS_REPO is this public repository; refusing."; exit 1; fi
          priv=$(curl -fsS -H "Authorization: Bearer ${REPORTS_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPORTS_REPO}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).private===true))}catch{process.stdout.write("false")}})') || priv=false
          [ "$priv" = "true" ] || { echo "::error title=Reports repository::REPORTS_REPO is not a private repository the token can see; refusing."; exit 1; }
          mkdir /tmp/r && cp unknown-places.json /tmp/r/ && cd /tmp/r
          git init -q -b places-report && git add unknown-places.json
          git -c user.name=ci -c user.email=ci@loopin.invalid commit -qm "Places without a photo, $(date -u +%F)"
          git push -qf "https://x-access-token:${REPORTS_TOKEN}@github.com/${REPORTS_REPO}.git" places-report >/dev/null 2>&1 || { echo "::error title=Reports repository::could not save the list (check REPORTS_REPO and REPORTS_TOKEN)."; exit 1; }
