name: Make the lockfile
on:
  push:
    branches: [lockfile-gen]
jobs:
  lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Security check of the packages
        run: npm audit --omit=dev --json > audit.json || true; node -e "const a=require('./audit.json');const m=a.metadata&&a.metadata.vulnerabilities||{};console.log('::notice title=npm audit::'+JSON.stringify(m))"
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add package-lock.json audit.json && git commit -qm "lockfile + audit" && git push -q origin HEAD:refs/heads/lockfile-gen
