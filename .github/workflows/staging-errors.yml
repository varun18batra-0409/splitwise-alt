name: Practice-site error records (one-off)
# Reads the PRACTICE database's own error records for the share pictures. Never the live database.
on:
  push:
    branches: [ops-staging-errors]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Error records
        env:
          TURSO_DATABASE_URL: ${{ secrets.STAGING_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.STAGING_TURSO_AUTH_TOKEN }}
          LIVE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          node scripts/db-address.mjs differ "$TURSO_DATABASE_URL" "$LIVE_URL" || { echo "::error::not the practice database"; exit 1; }
          node --input-type=module -e '
            import { createClient } from "@libsql/client";
            const db = createClient({ url: process.env.TURSO_DATABASE_URL, authToken: process.env.TURSO_AUTH_TOKEN });
            const r = await db.execute("SELECT createdAt, path, message, digest FROM ErrorLog WHERE path LIKE ? OR path LIKE ? ORDER BY createdAt DESC LIMIT 12", ["%passport%", "%square%"]);
            for (const x of r.rows) console.log("::notice::" + String(x.createdAt) + " | " + String(x.path) + " | " + String(x.message).replace(/\n/g, " ").slice(0, 400));
            if (!r.rows.length) console.log("::notice::no error records for these pictures");
          '
