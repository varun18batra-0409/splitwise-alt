name: Picture check (practice site)
# One-off: asks the practice site for a few files and pictures, with and without the access-lock pass, and prints status codes only.
on:
  push:
    branches: [ops-picture-check]
permissions:
  contents: read
  deployments: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Find the practice site for the update
        run: |
          full=$(gh api "repos/${{ github.repository }}/commits/staging" --jq .sha)
          echo "staging is at ${full:0:8}"
          url=""
          for i in $(seq 1 60); do
            for id in $(gh api "repos/${{ github.repository }}/deployments?sha=$full" --jq '.[].id'); do
              s=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0] | "\(.state) \(.environment_url)"')
              case "$s" in success\ https*) url=${s#success }; break 2;; esac
            done
            sleep 20
          done
          [ -n "$url" ] || { echo "::error::no practice site found"; exit 1; }
          echo "URL=$url" >> "$GITHUB_ENV"
      - name: Ask for files and pictures
        run: |
          for p in /opengraph-image /og-fonts/sans-500.woff /world.svg /api/health; do
            a=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$URL$p")
            b=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' -H "x-vercel-protection-bypass: $BYPASS" "$URL$p")
            echo "::notice title=$p::no pass: $a | with pass: $b"
          done
