# Every time code is pushed, GitHub installs everything, runs the tests and
# checks the app builds. A green tick on GitHub means it all worked.
#
# Saving GitHub minutes (the repo is private): the quick check runs on every
# push to the app's branches; the long tap-through of every screen (UAT and
# screenshots) runs by hand ("Run workflow") or when the commit message says
# [full], which every release candidate does before it goes to main. A newer
# push to the same branch replaces an older run.
name: Check
on:
  push:
    branches: [main, "phase*", staging, "next*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Known problems in the packages the live app uses (shown on every run; a critical one stops the build).
      - name: Package security check
        run: |
          npm audit --omit=dev --json > audit.json || true
          echo "::notice title=npm audit::$(node -e "const a=require('./audit.json');console.log(JSON.stringify((a.metadata||{}).vulnerabilities||{}))")"
          # Each advisory by name, so it can be checked one by one (where it's used, fix or mitigation).
          echo "::notice title=npm audit details::$(node -e "const a=require('./audit.json');const v=a.vulnerabilities||{};console.log(Object.values(v).map(x=>x.name+' ('+x.severity+(x.isDirect?', direct':', via '+[].concat(x.via).map(y=>typeof y==='string'?y:y.title+' '+(y.range||'')).join('; '))+'; fix: '+(x.fixAvailable===true?'yes':x.fixAvailable&&x.fixAvailable.name?x.fixAvailable.name+'@'+x.fixAvailable.version+(x.fixAvailable.isSemVerMajor?' (major)':''):'none')+')').join(' | '))")"
          npm audit --omit=dev --audit-level=critical
      - run: npm run db:setup
      - name: Tests
        run: |
          set -o pipefail
          # GITHUB_ACTIONS is blanked for the test run so vitest doesn't write its own annotations: a failing test whose
          # message holds a cut-in-half emoji crashed the runner's log writer and hid which test failed.
          GITHUB_ACTIONS= npm test 2>&1 | tee test.log || { echo "::error title=Tests failed::$(tail -60 test.log | iconv -c -f UTF-8 -t ASCII//TRANSLIT | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"; exit 1; }
          echo "::notice title=Tests::$(grep -E 'Test Files|Tests ' test.log | tr '\n' ' ')"
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || { echo "::error title=Build failed::$(tail -60 build.log | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"; exit 1; }
          echo "::notice title=Script per screen (first load)::$(grep -E 'First Load|^[├└┌].*(kB|B) ' build.log | grep -vE '_not-found|icon|manifest|robots|sitemap' | sed -E 's/[[:space:]]+/ /g' | head -60 | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"

  # Builds the app the way the hosting does (online-database mode, here with a
  # local stand-in file), fills it with demo data, opens every screen in a
  # phone-sized browser and saves the pictures to the "screenshots" branch.
  # Also runs on phase branches (with its own stand-in database), so a whole
  # phase is tapped through before it's merged.
  screens:
    needs: check
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TURSO_DATABASE_URL: file:/tmp/online-stand-in.db
      MAIL_OUTBOX: "1" # emails are kept in the database for the tests, never sent
      # A made-up Google app, so the "Continue with Google" button shows and its
      # first step (off to Google) can be checked. Nothing is sent to Google.
      GOOGLE_CLIENT_ID: uat-test.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: uat-not-a-secret
      CRON_SECRET: uat-only-not-a-real-secret # the test server's daily-job key (the live one is set in Vercel)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save tsx@4.19.2 # Playwright itself comes with @playwright/test (one version for everything)
      # The browsers, kept between runs: downloading them sometimes hangs on GitHub's machines.
      - name: Playwright version (from the lockfile)
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
      - name: Test browsers (system packages, then the browsers with retries)
        timeout-minutes: 15
        run: bash scripts/ci-browsers.sh chromium webkit
      - name: Start from the live version's tables (so the upgrade itself is tested)
        run: |
          git fetch -q --depth=1 origin main
          mkdir -p /tmp/live-schema
          git show origin/main:prisma/schema.prisma > /tmp/live-schema/schema.prisma
          npx prisma db push --skip-generate --schema /tmp/live-schema/schema.prisma
          cp /tmp/live-schema/dev.db /tmp/online-stand-in.db
      - name: Hosting build (schema sync, data upgrade, build)
        run: |
          set -o pipefail
          npm run vercel-build 2>&1 | tee vb.log || { echo "::error title=Hosting build failed::$(tail -60 vb.log | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"; exit 1; }
          echo "::notice title=Photos::$(grep 'photos:' vb.log | tr '\n' ' ')"
          echo "::notice title=Map::$(grep -E 'map:|fonts:' vb.log | tr '\n' ' ')"
          echo "::notice title=Schema upgrade from live::$(grep -E '^(ALTER|CREATE TABLE|DROP)|already matches|REFUSING' vb.log | tr '\n' ' ' | cut -c1-900)"
          node scripts/turso-sync.mjs | tee sync2.log
          grep -q "already matches" sync2.log || { echo "::error title=Schema sync not idempotent::$(cat sync2.log | tr '\n' ' ')"; exit 1; }
      - name: Demo data
        run: |
          set -o pipefail
          npx tsx scripts/seed-demo.ts 2>&1 | tee seed.log || { echo "::error title=Seed failed::$(tail -40 seed.log | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"; exit 1; }
      - name: Screenshots
        run: |
          set -o pipefail
          (npm run start > server.log 2>&1 &)
          npx --yes wait-on@8.0.1 -t 60000 http://localhost:3000
          npx tsx scripts/screenshots.ts 2>&1 | tee shots.log || { echo "::error title=Screenshots failed::$(tail -40 shots.log | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')%0A--- server ---%0A$(tail -20 server.log | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"; exit 1; }
      # Release evidence: the iPhone and desktop screenshots and the UAT MUST pass. They are allowed to finish
      # (continue-on-error), so the evidence below is still saved to the screenshots branch, and then the
      # "Required evidence" step at the end turns the job red. Speed and load numbers stay warnings on purpose
      # (a founder decision: CI machines are too noisy to fail a build on timings).
      - name: Screenshots on iPhone (Safari's engine)
        id: shots_ios
        continue-on-error: true
        run: |
          SHOT_ENGINE=webkit npx tsx scripts/screenshots.ts 2>&1 | tee shots-ios.log || true
          taken=$(grep -c '^✓' shots-ios.log || true); failed=$(grep -c '^✗' shots-ios.log || true)
          echo "::notice title=iPhone screens::$taken taken, $failed failed $(grep '^✗' shots-ios.log | head -5 | tr '\n' ' ')"
          if [ "${taken:-0}" -eq 0 ] || [ "${failed:-0}" -gt 0 ]; then echo "::error title=iPhone screenshots failed::$taken taken, $failed failed. $(grep '^✗' shots-ios.log | head -5 | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"; exit 1; fi
      - name: Screenshots on a desktop (1440×900)
        id: shots_desktop
        continue-on-error: true
        run: |
          SHOT_ENGINE=desktop npx tsx scripts/screenshots.ts 2>&1 | tee shots-desktop.log || true
          taken=$(grep -c '^✓' shots-desktop.log || true); failed=$(grep -c '^✗' shots-desktop.log || true)
          echo "::notice title=Desktop screens::$taken taken, $failed failed $(grep '^✗' shots-desktop.log | head -5 | tr '\n' ' ')"
          if [ "${taken:-0}" -eq 0 ] || [ "${failed:-0}" -gt 0 ]; then echo "::error title=Desktop screenshots failed::$taken taken, $failed failed. $(grep '^✗' shots-desktop.log | head -5 | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"; exit 1; fi
      - name: UAT (a person tapping through every feature)
        id: uat
        continue-on-error: true
        run: |
          npx tsx scripts/uat.ts 2>&1 | tee uat.log || true
          [ -f screenshots/uat/summary.txt ] || { echo "::error title=UAT::no result was written"; exit 1; }
          echo "::notice title=UAT::$(head -1 screenshots/uat/summary.txt)"
          if grep -q "^○" screenshots/uat/summary.txt; then
            echo "::warning title=UAT steps not run (not counted as passed)::$(grep '^○' screenshots/uat/summary.txt | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g' | cut -c1-3000)"
          fi
          if grep -q "✗\|crashed" screenshots/uat/summary.txt; then
            echo "::error title=UAT failures::$(tail -n +1 screenshots/uat/summary.txt | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"
            echo "::warning title=Server errors during UAT::$(grep -iE 'error|⨯|exception|digest' server.log | grep -v 'ExperimentalWarning' | tail -25 | cut -c1-300 | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"
            echo "::warning title=Prisma detail::$(grep -B2 -A14 -m3 'Invalid .*invocation' server.log | cut -c1-200 | tail -60 | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"
            exit 1
          fi
      - name: Speed on a phone (mid-range Android, 4G)
        run: |
          npx tsx scripts/perf-audit.ts 2>&1 | tee perf.log || true
          echo "::notice title=Phone speed::$(grep -E '^\| (Open|Tap|Type|People)' screenshots/uat/perf.md | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g')"
      - name: Load test (realistic data, many people at once)
        run: |
          # A fresh server just for this test, with speed measuring on (LOOPIN_PERF=1 is set nowhere else):
          # it logs every database call and how busy the server is, to perf-server.log.
          pkill -f next-server || true
          sleep 2
          (LOOPIN_PERF=1 npm run start > perf-server.log 2>&1 &)
          npx --yes wait-on@8.0.1 -t 60000 http://localhost:3000 || echo "::warning title=Load test server::the measuring server did not start in time"
          LOOPIN_PERF_LOG=perf-server.log npx tsx scripts/load.ts 2>&1 | tee load.log || true
          echo "::notice title=Load test::$(grep -E '^\|' screenshots/uat/load.md | tail -n +3 | tr '\n' ' ' | cut -c1-900)"
          echo "::notice title=Load test saves::$(grep -E 'expenses from|zero' screenshots/uat/load.md | tr '\n' ' ')"
          echo "::notice title=Speed per screen::$(awk '/One person at a time/{f=1} f && /^\|/' screenshots/uat/load.md | tail -n +3 | sed -e 's/%/%25/g' | tr '\n' '\r' | sed -e 's/\r/%0A/g' | cut -c1-1800)"
          echo "::notice title=Server busy-ness::$(grep -E 'Server busy-ness' screenshots/uat/load.md | tr '\n' ' ')"
          node scripts/load-gates.mjs || true
      - name: Save to the screenshots branch
        run: |
          cd screenshots
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init -q -b screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Screens for ${GITHUB_SHA::7}"
          # main → "screenshots"; a phase branch → "screenshots-phase4" etc.
          dest=screenshots; [ "$GITHUB_REF_NAME" = main ] || dest="screenshots-$GITHUB_REF_NAME"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "screenshots:$dest"
      # Last on purpose: the evidence above is saved first, then any failure of the required evidence makes the job red.
      # A step that did not run at all (an earlier step stopped) counts as not passed too.
      - name: Required evidence (screenshots and UAT must pass; speed and load stay warnings)
        if: always()
        run: |
          bad=""
          [ "${{ steps.shots_ios.outcome }}" = success ] || bad="$bad iPhone-screenshots(${{ steps.shots_ios.outcome }})"
          [ "${{ steps.shots_desktop.outcome }}" = success ] || bad="$bad desktop-screenshots(${{ steps.shots_desktop.outcome }})"
          [ "${{ steps.uat.outcome }}" = success ] || bad="$bad UAT(${{ steps.uat.outcome }})"
          if [ -n "$bad" ]; then echo "::error title=Release evidence failed::These must pass for a release candidate:$bad"; exit 1; fi
          echo "::notice title=Release evidence::iPhone and desktop screenshots and UAT all passed."
