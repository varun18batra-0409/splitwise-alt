name: Name check
on:
  push:
    branches: [check-names]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          names="roamates evensies kahoots tripsquad stampd tallytales splitstory crewbook allsquare evenstevens squarely gallivant pocketcrew groupjar wanderkitty kittyup mateship jaunty togetha passportpals roampal tripstamp crewly squadly evenly kittyapp stampbook wanderly hoppr tabtales"
          out=""
          for n in $names; do
            line="$n:"
            for tld in com app co io; do
              code=$(curl -s -L -o /dev/null -w '%{http_code}' --max-time 15 "https://rdap.org/domain/$n.$tld")
              case "$code" in 404) s="FREE";; 200) s="taken";; *) s="?$code";; esac
              line="$line $tld=$s"
            done
            echo "$line"
            out="$out$line%0A"
          done
          echo "::notice title=Domains::$out"
