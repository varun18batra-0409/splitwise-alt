name: Name check
on:
  push:
    branches: [check-names]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          names="roamates evensies kahoots tripsquad stampd tallytales splitstory crewbook allsquare evenstevens squarely gallivant pocketcrew groupjar kittyup mateship togetha passportpals roampal tripstamp crewly squadly stampbook wanderly evenup tabsquad tripjar splitstamp stampwise allsquared roamly togethr crewkitty gullak chumly tallyho squadtab roamtab"
          curl -s https://data.iana.org/rdap/dns.json -o dns.json
          base() { jq -r --arg t "$1" '.services[] | select(.[0] | index($t)) | .[1][0]' dns.json | head -1; }
          declare -A B; for t in com app co io; do B[$t]=$(base $t); echo "$t -> ${B[$t]}"; done
          q() { # registry RDAP: 404 = nobody has it
            curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${B[$2]%/}/domain/$1.$2" || echo "err"
          }
          out=""
          for n in $names; do
            line="$n:"
            for tld in com app co io; do
              code=$(q $n $tld); sleep 0.4
              case "$code" in 404) s="FREE";; 200) s="taken";; *) s="?$code";; esac
              line="$line $tld=$s"
            done
            echo "$line"
            out="$out$line%0A"
          done
          echo "::notice title=Domains::$out"
