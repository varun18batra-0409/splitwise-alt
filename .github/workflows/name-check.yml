name: Name check
on:
  push:
    branches: [check-names]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          names="tabtales crewstamp tripstamp merrymates yaarstamp tallytales huddlepot jollypot wanderpot storypot stampsquad passportpal gangstamp roamstamp everyonein allinloop roamtab triptally wandertab yaarpot jhoom safarnama kaafila hamsafar humsafar sangat toli mandali yaatri ghoomo getyaarlo gethuddlin getcrewlo gettallyin getevrin getstorytab getmerrytrip gettoli getsafarnama gethamsafar getkaafila crewlo tallyin evrin huddlin yaarlo storytab merrytrip caravanly clanin bunchin nomadin saathly yaariyan"
          curl -s https://data.iana.org/rdap/dns.json -o dns.json
          base() { jq -r --arg t "$1" '.services[] | select(.[0] | index($t)) | .[1][0]' dns.json | head -1; }
          declare -A B; for t in com app in; do B[$t]=$(base $t); echo "$t -> ${B[$t]}"; done
          q() { curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${B[$2]%/}/domain/$1.$2" || echo "err"; }
          out=""
          for n in $names; do
            line="$n:"
            for tld in com app in; do
              code=$(q $n $tld); sleep 0.3
              case "$code" in 404) s="FREE";; 200) s="taken";; *) s="?$code";; esac
              line="$line $tld=$s"
            done
            # Apps already called this (App Store titles that start with the name)
            ios=$(curl -s --max-time 15 "https://itunes.apple.com/search?term=$n&entity=software&limit=25&country=in" | jq --arg n "$n" '[.results[]?.trackName | ascii_downcase | select(startswith($n))] | length' 2>/dev/null || echo "?")
            line="$line ios=$ios"
            play=$(curl -s --max-time 15 -A "Mozilla/5.0" "https://play.google.com/store/search?q=$n&c=apps&hl=en&gl=IN" | grep -oiE ">$n[^<]{0,25}<" | sort -u | head -3 | tr '\n' '|' )
            line="$line play=[$play]"
            echo "$line"
            out="$out$line%0A"
          done
          echo "::notice title=Domains::$out"
