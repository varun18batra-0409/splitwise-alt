name: Name check
on:
  push:
    branches: [check-names]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -sL https://cdn.jsdelivr.net/npm/svgmap@2.20.0/dist/index.js -o m.js
          ls -la m.js
          echo "::notice title=size::$(wc -c < m.js)"
          echo "::notice title=paths::$(grep -o 'mapPaths' m.js | wc -l) $(grep -oE '[A-Z]{2}["]?\s*:\s*\{\s*["]?d["]?\s*:' m.js | head -3 | tr '\n' ' ')"
          echo "::notice title=sample::$(grep -oE '.{60}AF["]?\s*:\s*\{.{80}' m.js | head -2 | tr '\n' ' ' | sed 's/%/%25/g')"
          echo "::notice title=count::$(grep -oE '\b[A-Z]{2}["]?\s*:\s*\{\s*["]?d["]?\s*:' m.js | wc -l)"
          echo "::notice title=viewbox::$(grep -oE 'viewBox[^,;]{0,60}' m.js | head -3 | tr '\n' ' ')"
          echo "::notice title=license::$(head -c 400 m.js | tr '\n' ' ')"
