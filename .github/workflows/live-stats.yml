# Numbers about the live app (run by hand): speed on people's phones, and
# whether invites become members. Counts and timings only, never names,
# emails or amounts. The result is shown on the run's summary page.
name: Live stats
on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back"
        default: "24"
jobs:
  stats:
    runs-on: ubuntu-24.04
    environment: live-read # holds the read-only database key and the address
    # The database key is given only to the step that reads, and it is the READ-ONLY one (this job never writes).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm # the downloaded packages are kept between runs (keyed by package-lock.json)
          cache-dependency-path: package-lock.json
      - run: npm install --no-save --ignore-scripts --prefer-offline --no-audit --no-fund @libsql/client@0.15.0
      - name: Read the numbers
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_TOKEN }}
          HOURS: ${{ github.event.inputs.hours }}
        run: node scripts/live-stats.mjs && cat live-stats.md >> "$GITHUB_STEP_SUMMARY"
