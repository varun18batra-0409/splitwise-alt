name: probe-photos
on: { push: { branches: [phase-probe-photos] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && ./node_modules/.bin/playwright install --with-deps chromium
      - run: node sheet.mjs
        timeout-minutes: 45
      - if: always()
        run: |
          git config user.name ci && git config user.email ci@example.invalid
          git checkout --orphan probe-photos-out && git rm -rq --cached . && git add -f cands.json sheet
          git commit -qm "probe output" && git push -f origin probe-photos-out
