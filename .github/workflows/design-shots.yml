name: Design shots
on:
  push:
    branches: [check-names]
    paths: [design-shots/**, .github/workflows/design-shots.yml]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd design-shots && mkdir -p out && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1 && node shoot.cjs
      - run: |
          git config user.name shots && git config user.email shots@users.noreply.github.com
          git checkout -B design-shots-out
          git add -f design-shots/out && git commit -qm "Design shots" && git push -f origin design-shots-out
