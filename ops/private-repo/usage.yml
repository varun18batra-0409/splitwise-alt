# TEMPLATE (not active here). Copy to the PRIVATE ops repo as .github/workflows/usage.yml (see README.md).
# Weekly: how close are we to the Turso free-plan limits? Fails (and GitHub emails you) above 70%.
# Moved out of the public repo so the usage figures stop appearing on public run pages.
# Secrets in the private repo: TURSO_PLATFORM_TOKEN (read-only if Turso offers that) and TURSO_ORG.
name: Usage check
on:
  schedule:
    - cron: "33 3 * * 1" # Mondays, 09:03 India time
  workflow_dispatch:
permissions:
  contents: read
env:
  PUBLIC_REPO: varun18batra-0409/splitwise-alt
  # Full 40-character commit id of the public repo's main (see README.md).
  PUBLIC_REPO_SHA: REPLACE_WITH_40_CHARACTER_COMMIT_ID
jobs:
  usage:
    runs-on: ubuntu-24.04
    steps:
      - name: The pinned commit has been filled in
        run: |
          case "$PUBLIC_REPO_SHA" in *[!0-9a-f]*|"") echo "::error title=Not set up::PUBLIC_REPO_SHA must be a full 40-character commit id."; exit 1;; esac
          [ "${#PUBLIC_REPO_SHA}" -eq 40 ] || { echo "::error title=Not set up::PUBLIC_REPO_SHA must be 40 characters long."; exit 1; }
      # PIN: replace each @v4 with the full commit id of that tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PUBLIC_REPO }}
          ref: ${{ env.PUBLIC_REPO_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check usage
        env:
          TURSO_PLATFORM_TOKEN: ${{ secrets.TURSO_PLATFORM_TOKEN }}
          TURSO_ORG: ${{ secrets.TURSO_ORG }}
        run: node scripts/usage-check.mjs
