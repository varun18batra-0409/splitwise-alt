# TEMPLATE (not active here). Copy to the PRIVATE ops repo as .github/workflows/photo-backup.yml (see README.md).
# It is deliberately NOT in this public repo: it needs the live photo store's token (LIVE_BLOB_READ_WRITE_TOKEN), which Vercel only
# issues as read-AND-write, and that must never sit in the secrets of a public repository.
# Weekly copy of the photo store (Vercel Blob) into a SECOND store, then a check that a sample of the copies opens.
# Secrets in the private repo: LIVE_DB_URL, LIVE_DB_READONLY_TOKEN, LIVE_BLOB_READ_WRITE_TOKEN, BACKUP_BLOB_READ_WRITE_TOKEN.
# Until all four exist it says so and stops, green. Each secret goes only to the one step that needs it.
name: Photo backup
on:
  schedule:
    - cron: "37 21 * * 0" # every Sunday, 03:07 India time
  workflow_dispatch:
permissions:
  contents: read
env:
  PUBLIC_REPO: varun18batra-0409/splitwise-alt
  # Full 40-character commit id of the public repo's main (see ops/private-repo/README.md).
  PUBLIC_REPO_SHA: REPLACE_WITH_40_CHARACTER_COMMIT_ID
jobs:
  photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: The pinned commit has been filled in
        run: |
          case "$PUBLIC_REPO_SHA" in *[!0-9a-f]*|"") echo "::error title=Not set up::PUBLIC_REPO_SHA must be a full 40-character commit id."; exit 1;; esac
          [ "${#PUBLIC_REPO_SHA}" -eq 40 ] || { echo "::error title=Not set up::PUBLIC_REPO_SHA must be 40 characters long."; exit 1; }
      - name: Check the settings exist
        id: ready
        env:
          TURSO_DATABASE_URL: ${{ secrets.LIVE_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.LIVE_DB_READONLY_TOKEN }}
          LIVE_BLOB_READ_WRITE_TOKEN: ${{ secrets.LIVE_BLOB_READ_WRITE_TOKEN }}
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
        run: |
          missing=""
          for n in TURSO_DATABASE_URL TURSO_AUTH_TOKEN LIVE_BLOB_READ_WRITE_TOKEN BACKUP_BLOB_READ_WRITE_TOKEN; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -z "$missing" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Photo backup not set up::Nothing was copied. Missing:$missing (see ops/photo-backup/README.md)."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.ready.outputs.ok == '1'
        with:
          repository: ${{ env.PUBLIC_REPO }}
          ref: ${{ env.PUBLIC_REPO_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.ready.outputs.ok == '1'
        with:
          node-version: 22
      - name: Install the two packages the copy needs (exact versions, no install scripts)
        if: steps.ready.outputs.ok == '1'
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @libsql/client@0.15.0 @vercel/blob@2.9.0
      - name: Copy the photos and open a sample
        if: steps.ready.outputs.ok == '1'
        env:
          TURSO_DATABASE_URL: ${{ secrets.LIVE_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.LIVE_DB_READONLY_TOKEN }}
          LIVE_BLOB_READ_WRITE_TOKEN: ${{ secrets.LIVE_BLOB_READ_WRITE_TOKEN }}
          BACKUP_BLOB_READ_WRITE_TOKEN: ${{ secrets.BACKUP_BLOB_READ_WRITE_TOKEN }}
        run: node scripts/photo-backup.mjs
