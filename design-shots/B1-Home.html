<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.story{width:96px;height:132px;border-radius:20px;position:relative;overflow:hidden;flex:none;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.story.new{outline:2px solid var(--fg);outline-offset:2px}
.story .cap{position:absolute;left:9px;right:8px;bottom:9px;font-size:12.5px;font-weight:600;line-height:1.2}
.story .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.75))}
.g{display:flex;align-items:center;gap:14px;padding:11px 0}
.g img{width:50px;height:50px;border-radius:15px;object-fit:cover}
</style></head><body>
<div class="s">
  <div class="abs" style="left:0;right:0;top:0;height:560px">
    <img class="photo" src="img/beach-tall.jpg" alt="">
    <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(13,13,15,.55) 0%,rgba(13,13,15,0) 22%,rgba(13,13,15,.15) 45%,rgba(13,13,15,.85) 78%,#0D0D0F 100%)"></div>
  </div>

  <div class="abs row" style="left:20px;right:16px;top:18px;justify-content:space-between">
    <span class="serif" style="font-size:26px;font-weight:600">loopin</span>
    <div class="row" style="gap:8px">
      <span class="round glass"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16ZM10 20.5a2 2 0 0 0 4 0"/></svg></span>
      <span class="round" style="background:#3A2A1E;color:#FFC9A0;font-weight:700;font-size:15px;border:1px solid rgba(244,242,236,.2)">V</span>
    </div>
  </div>

  <div class="abs" style="left:20px;right:20px;top:132px">
    <span class="row glass" style="display:inline-flex;gap:8px;padding:6px 12px 6px 6px;border-radius:16px;font-size:13px;font-weight:600">
      <span class="row"><span class="av a2" style="width:22px;height:22px;font-size:10px;border-width:1.5px">A</span><span class="av a3" style="width:22px;height:22px;font-size:10px;border-width:1.5px;margin-left:-6px">R</span><span class="av a4" style="width:22px;height:22px;font-size:10px;border-width:1.5px;margin-left:-6px">M</span></span>
      Your next trip, with 3 friends</span>
    <div class="serif" style="font-size:30px;line-height:1;margin-top:16px;font-weight:500">Goa in</div>
    <div class="serif" style="font-size:84px;line-height:.92;font-weight:600;text-shadow:0 4px 30px rgba(0,0,0,.35)">12 days</div>
  </div>

  <div class="abs row" style="left:20px;top:356px;gap:10px;width:460px">
    <div class="story new"><img class="photo" src="img/pot-tall.jpg" alt=""><div class="shade"></div><div class="cap">You won ₹600 at card night</div></div>
    <div class="story new"><img class="photo" src="img/pune-tall.jpg" alt=""><div class="shade"></div><div class="cap">Pune, wrapped</div></div>
    <div class="story"><img class="photo" src="img/manali.jpg" alt=""><div class="shade"></div><div class="cap">Manali in 45 days</div></div>
    <div class="story" style="opacity:.75"><img class="photo" src="img/friends.jpg" alt=""><div class="shade"></div><div class="cap">Gift jar, 4 of 6 paid</div></div>
  </div>

  <div class="abs glass" style="left:16px;right:16px;top:512px;border-radius:26px;padding:18px 18px 16px">
    <div class="row" style="justify-content:space-between">
      <span class="soft" style="font-size:14px">Coming back to you</span>
      <span class="mute" style="font-size:13px">from 3 people</span>
    </div>
    <div class="amt owed" style="font-size:44px;line-height:1.1;margin-top:2px">₹68,220</div>
    <div class="row" style="gap:10px;margin-top:14px">
      <span class="btn" style="flex:1;height:46px">Settle up</span>
      <span class="btn2" style="flex:1;height:46px;font-size:15px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4Z"/></svg>Remind all</span>
    </div>
  </div>

  <div class="abs" style="left:20px;right:20px;top:688px">
    <div class="g">
      <img src="img/thailand.jpg" alt="">
      <div class="col" style="flex:1"><span style="font-weight:600;font-size:16px">Thailand trip</span><span class="mute" style="font-size:13px">Ravi added Night market dinner</span></div>
      <span class="amt owed" style="font-size:18px">+₹17,618</span>
    </div>
  </div>

  <div class="nav glass" style="background:rgba(22,22,26,.78)">
    <span class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5 12 3.5l9 7V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/></svg>Home</span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Recap</span>
    <span class="plus"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Settle</span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>You</span>
  </div>
</div></body></html>
