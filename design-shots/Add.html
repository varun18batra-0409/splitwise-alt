<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add an expense</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#E7E4DC}
a{color:#16161a}a:hover{color:#4a4945}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F3B3E; color: #16161A; font-family: 'Inter', system-ui, sans-serif;">
  <img src="img/thailand.jpg" alt="" style="position: absolute; left: 0; top: 0; width: 100%; height: 300px; object-fit: cover; opacity: 0.55;">
  <div style="position: absolute; inset: 0; background: rgba(10,30,32,0.45);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 96px; background: #FBFAF7; border-radius: 30px 30px 0 0; box-shadow: 0 -20px 50px rgba(0,0,0,0.25); padding: 10px 20px 0; box-sizing: border-box;">
    <div style="width: 42px; height: 5px; border-radius: 3px; background: #D8D4CA; margin: 0 auto 14px;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 14px; color: #5E5C57;">Thailand trip</span>
      <div style="display: flex; padding: 3px; border-radius: 16px; background: #EFECE5;">
        <span style="padding: 6px 12px; border-radius: 13px; background: #FFFFFF; font-size: 13px; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">Money spent</span>
        <span style="padding: 6px 12px; font-size: 13px; font-weight: 600; color: #5E5C57;">Money back</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 26px;">
      <span style="padding: 6px 12px; border-radius: 14px; background: #EFECE5; font-size: 13px; font-weight: 700;">THB</span>
      <span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 64px; letter-spacing: -0.03em; line-height: 1.1; margin-top: 6px;">1,800</span>
      <span style="font-size: 14px; color: #5E5C57;">About ₹5,257 with your card fee</span>
    </div>

    <label style="display: block; margin-top: 22px;">
      <span style="display: block; font-size: 13px; font-weight: 600; color: #5E5C57; margin-bottom: 6px;">What was it?</span>
      <input value="Night market dinner" style="width: 100%; box-sizing: border-box; height: 52px; border-radius: 16px; border: 1px solid #E2DED5; background: #FFFFFF; padding: 0 16px; font-family: 'Inter', sans-serif; font-size: 16px; color: #16161A;">
    </label>

    <div style="margin-top: 18px;">
      <span style="display: block; font-size: 13px; font-weight: 600; color: #5E5C57; margin-bottom: 8px;">Who paid?</span>
      <div style="display: flex; gap: 8px;">
        <button style="height: 40px; padding: 0 14px 0 6px; border-radius: 20px; border: 2px solid #16161A; background: #FFFFFF; display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; color: #16161A;"><span style="width: 28px; height: 28px; border-radius: 14px; background: #FFE8D6; color: #9A4A14; font-size: 12px; display: flex; align-items: center; justify-content: center;">V</span>You</button>
        <button style="height: 40px; padding: 0 14px 0 6px; border-radius: 20px; border: 1px solid #E2DED5; background: #FFFFFF; display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: #16161A;"><span style="width: 28px; height: 28px; border-radius: 14px; background: #DDF5E8; color: #1F6B48; font-size: 12px; display: flex; align-items: center; justify-content: center;">A</span>Asha</button>
        <button style="height: 40px; padding: 0 14px 0 6px; border-radius: 20px; border: 1px solid #E2DED5; background: #FFFFFF; display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: #16161A;"><span style="width: 28px; height: 28px; border-radius: 14px; background: #E5E3F7; color: #45399C; font-size: 12px; display: flex; align-items: center; justify-content: center;">R</span>Ravi</button>
      </div>
    </div>

    <div style="margin-top: 18px; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2DED5;">
      <div style="display: flex; flex-direction: column;"><span style="font-weight: 700; font-size: 15px;">Split equally, 4 people</span><span style="font-size: 13px; color: #5E5C57;">₹1,314 each</span></div>
      <a href="#" style="font-size: 14px; font-weight: 600;">Change</a>
    </div>

    <button style="position: absolute; left: 20px; right: 20px; bottom: 30px; height: 56px; border-radius: 28px; border: 0; background: #FF6B3D; color: #16161A; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 17px; box-shadow: 0 12px 26px rgba(255,107,61,0.35);">Save expense</button>
  </div>
</div>


</body>
</html>
