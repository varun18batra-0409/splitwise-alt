<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.lab{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:8px;display:block}
.chip{height:42px;padding:0 14px 0 6px;border-radius:21px;border:1px solid var(--line);background:var(--mist);display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.chip.on{border:1.5px solid var(--fg);background:#26262B}
</style></head><body>
<div class="s" style="background:#081011">
  <img src="img/thailand.jpg" alt="" class="abs" style="left:0;top:0;width:100%;height:260px;object-fit:cover;opacity:.5">
  <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(8,16,17,.3),rgba(8,16,17,.8) 30%)"></div>

  <div class="abs" style="left:0;right:0;bottom:0;top:84px;background:var(--card);border-radius:32px 32px 0 0;box-shadow:0 -24px 60px rgba(0,0,0,.55);border-top:1px solid rgba(244,242,236,.08);padding:10px 20px 0">
    <div style="width:40px;height:5px;border-radius:3px;background:#3A3A41;margin:0 auto 16px"></div>
    <div class="row" style="justify-content:space-between">
      <span class="row" style="gap:8px;font-size:14px;font-weight:600"><img src="img/thailand.jpg" alt="" style="width:24px;height:24px;border-radius:8px;object-fit:cover">Thailand trip</span>
      <div class="row" style="padding:3px;border-radius:17px;background:var(--mist)">
        <span style="padding:7px 13px;border-radius:14px;background:var(--fg);color:#0D0D0F;font-size:13px;font-weight:700">Spent</span>
        <span style="padding:7px 13px;font-size:13px;font-weight:600" class="soft">Got back</span>
      </div>
    </div>

    <div class="col" style="align-items:center;margin-top:30px">
      <div class="row" style="gap:10px;align-items:baseline">
        <span class="row" style="gap:4px;padding:6px 10px;border-radius:12px;background:var(--mist);font-size:14px;font-weight:700;align-self:center">THB<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span>
        <span class="amt" style="font-size:76px;line-height:1">1,800</span><span style="width:2px;height:58px;background:var(--fg);align-self:center;opacity:.8"></span>
      </div>
      <span class="soft" style="font-size:14px;margin-top:8px">About ₹4,450 with your 3% card fee</span>
    </div>

    <div style="margin-top:28px">
      <span class="lab">What was it?</span>
      <div class="row" style="height:54px;border-radius:18px;background:var(--mist);border:1px solid var(--line);padding:0 8px 0 16px;justify-content:space-between">
        <span style="font-size:16px">Night market dinner</span>
        <span class="row" style="gap:6px;padding:6px 10px;border-radius:12px;background:rgba(111,227,168,.12);color:var(--owed);font-size:13px;font-weight:600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16.5 3c-1.9 1-3 3.2-3 6v3h3v9"/></svg>Food</span>
      </div>
    </div>

    <div style="margin-top:20px">
      <span class="lab">Who paid?</span>
      <div class="row" style="gap:8px">
        <span class="chip on"><span class="av a1" style="width:28px;height:28px;border:0">V</span>You</span>
        <span class="chip"><span class="av a2" style="width:28px;height:28px;border:0">A</span>Asha</span>
        <span class="chip"><span class="av a3" style="width:28px;height:28px;border:0">R</span>Ravi</span>
        <span class="chip"><span class="av a4" style="width:28px;height:28px;border:0">M</span>Meera</span>
      </div>
    </div>

    <div class="row" style="margin-top:20px;justify-content:space-between;padding:14px 16px;border-radius:18px;background:var(--mist);border:1px solid var(--line)">
      <div class="col"><span style="font-weight:600;font-size:15px">Split equally between 4</span><span class="mute" style="font-size:13px">₹1,113 each, you lent ₹3,338</span></div>
      <span style="font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px">Change</span>
    </div>

    <div class="abs row" style="left:20px;right:20px;bottom:30px;gap:10px">
      <span class="round" style="width:56px;height:56px;border-radius:28px;background:var(--mist);border:1px solid var(--line)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <span class="btn" style="flex:1;height:56px;border-radius:28px;font-size:17px">Save expense</span>
    </div>
  </div>
</div></body></html>
