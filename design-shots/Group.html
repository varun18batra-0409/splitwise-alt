<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thailand trip group</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#E7E4DC}
a{color:#0F5E63}a:hover{color:#0b4a4e}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF5F4; color: #16161A; font-family: 'Inter', system-ui, sans-serif;">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 330px; overflow: hidden;">
    <img src="img/thailand.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover;">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,60,64,0.55) 0%, rgba(10,60,64,0.1) 35%, rgba(10,60,64,0.35) 70%, rgba(238,245,244,1) 100%);"></div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; top: 18px; display: flex; justify-content: space-between;">
    <button aria-label="Back" style="width: 42px; height: 42px; border-radius: 21px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.22); backdrop-filter: blur(14px); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>
    <div style="display: flex; gap: 8px;">
      <button aria-label="Add people" style="width: 42px; height: 42px; border-radius: 21px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.22); backdrop-filter: blur(14px); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0;"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20a6 6 0 0 1 12 0M18 8v6M21 11h-6"></path></svg></button>
      <button aria-label="Group settings" style="width: 42px; height: 42px; border-radius: 21px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.22); backdrop-filter: blur(14px); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0;"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg></button>
    </div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; top: 126px; color: #FFFFFF;">
    <span style="padding: 5px 11px; border-radius: 12px; background: rgba(255,255,255,0.22); backdrop-filter: blur(12px); font-size: 13px; font-weight: 600;">Trip with 4 people</span>
    <div style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 42px; line-height: 1.02; letter-spacing: -0.02em; margin-top: 10px; text-shadow: 0 2px 16px rgba(0,0,0,0.3);">Thailand trip</div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; top: 228px; padding: 16px 18px; border-radius: 24px; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 16px 36px rgba(10,60,64,0.14);">
    <span style="font-size: 14px; color: #4C5B5B;">You’re owed</span>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 2px;">
      <span style="font-family: 'Fraunces', serif; font-weight: 700; font-size: 36px; color: #1F7A50; letter-spacing: -0.02em;">₹17,618</span>
      <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: #FF6B3D; color: #16161A; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px;">Settle up</button>
    </div>
    <span style="font-size: 13px; color: #4C5B5B;">Meera and Ravi owe you. 3 payments clear everything.</span>
  </div>

  <div role="tablist" aria-label="Group views" style="position: absolute; left: 16px; right: 16px; top: 368px; height: 44px; border-radius: 22px; background: #DCEBEA; display: flex; padding: 4px; box-sizing: border-box; gap: 4px;">
    <button role="tab" aria-selected="true" style="flex: 1; border-radius: 18px; border: 0; background: #FFFFFF; color: #0F5E63; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; box-shadow: 0 2px 8px rgba(10,60,64,0.12);">Activity</button>
    <button role="tab" aria-selected="false" style="flex: 1; border-radius: 18px; border: 0; background: transparent; color: #3E5A5A; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;">Balances</button>
    <button role="tab" aria-selected="false" style="flex: 1; border-radius: 18px; border: 0; background: transparent; color: #3E5A5A; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;">Charts</button>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 430px;">
    <span style="font-size: 13px; font-weight: 600; color: #4C5B5B;">Today</span>
    <div style="display: flex; align-items: center; gap: 14px; padding: 12px 0;">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #D6ECEA; color: #0F5E63; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16.5 3c-1.9 1-3 3.2-3 6v3h3v9"></path></svg></span>
      <div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600; font-size: 16px;">Night market dinner</span><span style="font-size: 13px; color: #4C5B5B;">You paid THB 1,800</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end;"><span style="font-weight: 700; font-size: 15px; color: #1F7A50;">₹3,828</span><span style="font-size: 12px; color: #4C5B5B;">you lent</span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid #D3E3E2;">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #D6ECEA; color: #0F5E63; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17l1.5-6h9L18 17M8 11l1-4h6l1 4"></path><circle cx="8" cy="19" r="1.5"></circle><circle cx="16" cy="19" r="1.5"></circle></svg></span>
      <div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600; font-size: 16px;">Tuk-tuk to the pier</span><span style="font-size: 13px; color: #4C5B5B;">Ravi paid THB 400</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end;"><span style="font-weight: 700; font-size: 15px; color: #B4541A;">₹319</span><span style="font-size: 12px; color: #4C5B5B;">you borrowed</span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid #D3E3E2;">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: #D6ECEA; color: #0F5E63; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5M5 9.5V20h14V9.5M10 20v-5h4v5"></path></svg></span>
      <div style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600; font-size: 16px;">Villa in Krabi</span><span style="font-size: 13px; color: #4C5B5B;">Meera paid ₹48,000</span></div>
      <div style="display: flex; flex-direction: column; align-items: flex-end;"><span style="font-weight: 700; font-size: 15px; color: #B4541A;">₹12,000</span><span style="font-size: 12px; color: #4C5B5B;">you borrowed</span></div>
    </div>
  </div>

  <button aria-label="Add an expense" style="position: absolute; right: 20px; bottom: 28px; height: 58px; padding: 0 22px 0 18px; border-radius: 29px; border: 0; background: #FF6B3D; color: #16161A; display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; box-shadow: 0 12px 26px rgba(255,107,61,0.4);"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add expense</button>
</div>


</body>
</html>
